services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # falha alto e claro se faltar, em vez de servir num host vazio e nunca emitir certificado
      DLP_DOMAIN: "${DLP_DOMAIN:?defina DLP_DOMAIN no .env, por exemplo dlp.seudominio.com}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
